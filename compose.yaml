services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-laptophub

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laptophub}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?err MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?err MYSQL_PASSWORD is required}

    ports:
      - "${DB_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - ecommerce-net
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: minio-laptophub
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?err MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - ecommerce-net

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: minio-init
    labels:
      org.springframework.boot.ignore: "true"
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?err MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-laptophub}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set download local/$$MINIO_BUCKET;
      echo '' | mc pipe local/$$MINIO_BUCKET/products/.keep;
      echo '' | mc pipe local/$$MINIO_BUCKET/brands/.keep;
      exit 0;
      "
    networks:
      - ecommerce-net

  redis:
    image: redis:8.10.1-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

volumes:
  mysql_data:
  minio_data:
  redis_data:

networks:
  ecommerce-net:
    driver: bridge
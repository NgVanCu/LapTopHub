server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: laptophub-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:laptophub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:LaptopHub <no-reply@laptophub.local>}
  email-verification:
    ttl: 24h
    verify-url: ${app.base-url}/api/v1/auth/verify-email

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  base-url: ${APP_BASE_URL:http://localhost:8080}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:15m}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:30d}

logging:
  level:
    com.laptophub: DEBUG